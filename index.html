<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CASHBORAD MOU70 | สตง. สุรินทร์</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #edf4ff;
      color: #132d51;
      font: 16px/1.6 system-ui, sans-serif;
    }
    main {
      max-width: 760px;
      margin: 5vh auto;
      padding: clamp(24px, 6vw, 48px);
      border-top: 5px solid #d7a63a;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 12px 36px #132d511a;
    }
    h1 { margin: 0; color: #0a315f; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; }
    [hidden] { display: none !important; }
    .button {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 8px;
      background: #124b92;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    .button:hover { filter: brightness(1.12); }
    .button:focus-visible {
      outline: 3px solid #d7a63a;
      outline-offset: 3px;
    }
    .admin { background: #51418c; }
    .sheet { background: #166534; }
    #status { color: #714b13; }
  </style>
</head>
<body>
  <main>
    <p>สำนักตรวจเงินแผ่นดินจังหวัดสุรินทร์</p>
    <h1>CASHBORAD MOU70</h1>
    <p>ระบบติดตามงานตามข้อตกลงการปฏิบัติราชการ ปีงบประมาณ 2570</p>

    <nav id="accounts" aria-label="ระบบบัญชี" hidden>
      <a class="button" id="login">เข้าสู่ระบบ</a>
      <a class="button" id="register">ลงทะเบียน</a>
      <a class="button admin" id="admin">แอดมิน · จัดการทะเบียน</a>
    </nav>

    <p id="status" role="status">รอผู้ดูแลตั้งค่า URL เซิร์ฟเวอร์บัญชี</p>

    <p>
      <a class="button sheet"
         href="https://docs.google.com/spreadsheets/d/1RAdbMO-a8Xvu10cdrDoKRkPmbM04Wzi4oV5WDEEvFOU/edit"
         target="_blank"
         rel="noopener noreferrer">
        กรอกข้อมูล MOU สำหรับผู้อำนวยการกลุ่ม 1–5
      </a>
    </p>
  </main>

  <script>
    // ใส่ URL แบบ HTTPS ของเซิร์ฟเวอร์ที่รัน server.mjs
    const ACCOUNT_SERVER = '';

    if (ACCOUNT_SERVER.trim()) {
      try {
        const server = new URL(ACCOUNT_SERVER.trim());
        if (server.protocol !== 'https:') {
          throw new Error('HTTPS required');
        }

        document.getElementById('login').href = server.origin + '/#login';
        document.getElementById('register').href = server.origin + '/register#register';
        document.getElementById('admin').href = server.origin + '/admin';
        document.getElementById('accounts').hidden = false;
        document.getElementById('status').hidden = true;
      } catch {
        document.getElementById('status').textContent =
          'กรุณาตั้ง URL เซิร์ฟเวอร์บัญชีเป็น HTTPS';
      }
    }
  </script>
</body>
</html>
